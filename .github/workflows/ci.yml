name: Validate tracker
on:
  push:
    branches: [main]
    paths:
      - 'tracker.py'
      - 'intelligence.py'
      - 'community.py'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
